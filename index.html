<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Texture Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e0e0;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* UI Overlay */
    .ui-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 480px;
      background: rgba(24, 24, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }
    
    .slots-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .file-slot {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      position: relative;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    
    .file-slot:active, .file-slot.has-file {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }
    
    .file-slot input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    
    .slot-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      margin-bottom: 4px;
    }
    
    .file-name {
      font-size: 11px;
      color: #3b82f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .control-group label {
      color: #888;
      font-size: 10px;
    }
    
    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }
    
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    
    .btn:active {
      background: #2563eb;
    }
    
    .toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="toast" class="toast">Texture Loaded</div>

  <div class="ui-panel">
    <div class="panel-header">
      <span class="panel-title">Texture Viewer</span>
    </div>

    <div class="slots-container">
      <div class="file-slot" id="color-slot">
        <span class="slot-label">Color Map</span>
        <span class="file-name" id="color-name">Tap to select</span>
        <input type="file" id="color-input" accept="image/*">
      </div>
      <div class="file-slot" id="normal-slot">
        <span class="slot-label">Normal Map</span>
        <span class="file-name" id="normal-name">Tap to select</span>
        <input type="file" id="normal-input" accept="image/*">
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label>Roughness</label>
        <input type="range" id="roughness" min="0" max="1" step="0.05" value="0.5">
      </div>
      <div class="control-group">
        <label>Metalness</label>
        <input type="range" id="metalness" min="0" max="1" step="0.05" value="0.1">
      </div>
      <div class="control-group">
        <label>Normal Scale</label>
        <input type="range" id="normal-scale" min="0" max="3" step="0.1" value="1">
      </div>
      <div class="control-group">
        <label>Light Height</label>
        <input type="range" id="light-height" min="1" max="10" step="0.5" value="4">
      </div>
    </div>

    <button class="btn" id="reload-btn">Apply Textures</button>
  </div>

  <script>
    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // --- Controls ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't go below ground
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(2, 4, 2);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 15;
    dirLight.shadow.camera.left = -3;
    dirLight.shadow.camera.right = 3;
    dirLight.shadow.camera.top = 3;
    dirLight.shadow.camera.bottom = -3;
    // Shadow Bias Settings to eliminate banding/shadow acne
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.02;
    scene.add(dirLight);

    // Helper Light Indicator Mesh
    const lightHelperGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const lightHelperMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
    const lightHelper = new THREE.Mesh(lightHelperGeo, lightHelperMat);
    dirLight.add(lightHelper);

    // --- Mesh & Material ---
    const planeGeo = new THREE.PlaneGeometry(3, 3, 64, 64);
    const planeMat = new THREE.MeshStandardMaterial({
      color: 0xcccccc,
      roughness: 0.5,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    plane.castShadow = true;
    scene.add(plane);

    // Grid Floor
    const grid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
    grid.position.y = -0.01;
    scene.add(grid);

    // --- Texture Loading Engine ---
    const textureLoader = new THREE.TextureLoader();
    let pendingColorUrl = null;
    let pendingNormalUrl = null;

    function optimizeTexture(texture, isSRGB = false) {
      if (!texture) return;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (isSRGB) {
        texture.encoding = THREE.sRGBEncoding;
      }
      texture.needsUpdate = true;
    }

    function handleFileSelect(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const objectUrl = URL.createObjectURL(file);

      if (type === 'color') {
        if (pendingColorUrl) URL.revokeObjectURL(pendingColorUrl);
        pendingColorUrl = objectUrl;
        document.getElementById('color-name').innerText = file.name;
        document.getElementById('color-slot').classList.add('has-file');
      } else if (type === 'normal') {
        if (pendingNormalUrl) URL.revokeObjectURL(pendingNormalUrl);
        pendingNormalUrl = objectUrl;
        document.getElementById('normal-name').innerText = file.name;
        document.getElementById('normal-slot').classList.add('has-file');
      }

      applyTextures();
    }

    function applyTextures() {
      let loadedAny = false;

      if (pendingColorUrl) {
        textureLoader.load(pendingColorUrl, (tex) => {
          optimizeTexture(tex, true);
          if (planeMat.map) planeMat.map.dispose();
          planeMat.map = tex;
          planeMat.color.setHex(0xffffff);
          planeMat.needsUpdate = true;
          showToast("Color map applied!");
        });
        loadedAny = true;
      }

      if (pendingNormalUrl) {
        textureLoader.load(pendingNormalUrl, (tex) => {
          optimizeTexture(tex, false);
          if (planeMat.normalMap) planeMat.normalMap.dispose();
          planeMat.normalMap = tex;
          planeMat.needsUpdate = true;
          showToast("Normal map applied!");
        });
        loadedAny = true;
      }

      if (!loadedAny) {
        showToast("Select a file first!");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // --- UI Listeners ---
    document.getElementById('color-input').addEventListener('change', (e) => handleFileSelect(e, 'color'));
    document.getElementById('normal-input').addEventListener('change', (e) => handleFileSelect(e, 'normal'));
    document.getElementById('reload-btn').addEventListener('click', applyTextures);

    document.getElementById('roughness').addEventListener('input', (e) => {
      planeMat.roughness = parseFloat(e.target.value);
    });

    document.getElementById('metalness').addEventListener('input', (e) => {
      planeMat.metalness = parseFloat(e.target.value);
    });

    document.getElementById('normal-scale').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      planeMat.normalScale.set(val, val);
    });

    document.getElementById('light-height').addEventListener('input', (e) => {
      dirLight.position.y = parseFloat(e.target.value);
    });

    // --- Render Loop & Resize ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
